<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Jino Reception Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/receptionist-schedule.css">
</head>
<body>

<div class="shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand">
        <span class="brand-mark">J</span>
        <span class="brand-name">Jino</span>
      </div>
      <button class="side-close" id="sideClose" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>

    <nav class="side-nav">
      <p class="side-label">Front Desk</p>
      <a href="receptionist-dashboard.html" class="side-link" data-page="overview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.7"/></svg>
        Overview
      </a>
      <a href="receptionist-patients.html" class="side-link" data-page="patients">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.4" stroke="currentColor" stroke-width="1.7"/><path d="M3 20c.6-3.8 3-5.8 6-5.8s5.4 2 6 5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="17.5" cy="8.5" r="2.6" stroke="currentColor" stroke-width="1.7"/><path d="M15.7 13.6c2.6.3 4.4 2.1 4.9 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Patients
      </a>
      <a href="receptionist-schedule.html" class="side-link is-active" data-page="schedule">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="2.2" stroke="currentColor" stroke-width="1.7"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Schedule
      </a>
      <a href="receptionist-billing.html" class="side-link" data-page="billing">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9 8h6M9 12h6M9 16h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Billing &amp; Payments
      </a>

      <p class="side-label">Account</p>
      <a href="receptionist-profile.html" class="side-link" data-page="profile">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.7"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Profile &amp; Settings
      </a>
    </nav>

    <div class="side-bottom">
      <a href="../login.html" class="side-link side-logout" id="logoutLink">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 17l5-5-5-5M20 12H9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 19H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        Log Out
      </a>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ============ MAIN ============ -->
  <div class="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="side-open" id="sideOpen" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div>
          <p class="topbar-kicker">Reception Portal</p>
          <h1 class="topbar-title">Schedule</h1>
        </div>
      </div>
      <div class="topbar-right">
        <div class="avatar" id="avatarInitials">RC</div>
      </div>
    </header>

    <main class="content">

      <section class="panel">

        <div class="sched-toolbar">
          <div class="sched-toolbar-left">
            <button class="btn btn-outline sched-today-btn" id="todayBtn" type="button">Today</button>
            <button class="sched-nav-btn" id="prevBtn" type="button" aria-label="Previous">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="sched-nav-btn" id="nextBtn" type="button" aria-label="Next">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="sched-date-label" id="dateLabel">—</span>
          </div>
          <div class="sched-toolbar-right">
            <span class="sched-count" id="apptCount"></span>
            <select class="field-input dentist-filter" id="dentistFilter">
              <option value="all">All dentists</option>
            </select>
            <div class="segmented" id="viewToggle">
              <button type="button" class="segmented-opt is-active" data-view="day">Day</button>
              <button type="button" class="segmented-opt" data-view="week">Week</button>
            </div>
          </div>
        </div>

        <!-- ---- Day view: hour-by-dentist grid ---- -->
        <div class="msched-wrap" id="dayWrap">
          <div class="msched-grid" id="dayGrid"><!-- rendered by JS --></div>
        </div>

        <!-- ---- Week view: 7 columns for one selected dentist ---- -->
        <div class="week-grid" id="weekGrid" style="display:none;"><!-- rendered by JS --></div>

      </section>

    </main>
  </div>
</div>

<!-- ============ RESCHEDULE MODAL ============ -->
<div class="modal-scrim" id="rescheduleModalScrim">
  <div class="modal">
    <div class="modal-head">
      <div>
        <p class="modal-kicker">Reschedule</p>
        <h2 id="rescheduleModalTitle">Appointment</h2>
      </div>
    </div>

    <div style="margin-top:18px;">
      <label class="field-label" for="rescheduleDate">Date</label>
      <input class="field-input" type="date" id="rescheduleDate">
    </div>

    <div style="margin-top:14px; display:flex; gap:12px;">
      <div style="flex:1;">
        <label class="field-label" for="rescheduleStart">Start time</label>
        <input class="field-input" type="time" id="rescheduleStart">
      </div>
      <div style="flex:1;">
        <label class="field-label" for="rescheduleEnd">End time</label>
        <input class="field-input" type="time" id="rescheduleEnd">
      </div>
    </div>

    <div class="modal-foot">
      <button class="btn btn-outline" id="rescheduleModalCancel" type="button">Cancel</button>
      <button class="btn btn-primary" id="rescheduleModalSave" type="button">Save new time</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!--
  api.js must load first — it defines fetchMethod / getStoredUser / clearSession.
  avatar.js must load next — it defines the shared Avatar.* helpers.
-->
<script src="../js/api.js"></script>
<script src="../js/avatar.js"></script>
<script src="../js/receptionistSchedule.js"></script>
</body>
</html>
